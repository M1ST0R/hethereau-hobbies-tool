name: Build HHT packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.4.0 or 0.4.0-beta.1. Leave empty for a DEV build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: windows-x64
          - os: ubuntu-22.04
            label: Linux x86_64
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve application version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $createTag = "false"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Invalid version tag: $env:GITHUB_REF_NAME"
            }
            $channel = "release"
          } elseif (![string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $version = $env:RELEASE_VERSION.Trim()
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Invalid version '$version'. Use SemVer without the leading v, e.g. 0.4.0 or 0.4.0-beta.1."
            }
            $channel = "release"
            $createTag = "true"
          } else {
            $version = "0.3.0-dev.$($env:GITHUB_RUN_NUMBER)+$($env:GITHUB_SHA.Substring(0,7))"
            $channel = "dev"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "create_tag=$createTag" >> $env:GITHUB_OUTPUT
          @(
            "APP_VERSION = `"$version`""
            "APP_CHANNEL = `"$channel`""
          ) | Set-Content -Path "hht_build_info.py" -Encoding ascii
          Write-Host "Building HHT $version ($channel)"

      - name: Install Windows OCR engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install tesseract --yes --no-progress

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-tk scrot wmctrl pkg-config libcairo2-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus libx11-6 libxtst6 libxinerama1 libxrandr2 libxi6 libxcb1 libxkbcommon-x11-0

      - name: Install Python dependencies and validate assets
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m py_compile hethereau_hobbies_tool.py hht_build_info.py hht_ocr.py tests/test_ocr_ratio.py
          python -m unittest discover -s tests -v
          python scripts/check_material_symbols.py

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tesseractDir = "$env:ProgramFiles\Tesseract-OCR"
          if (!(Test-Path "$tesseractDir\tesseract.exe")) { throw "Tesseract was not found at $tesseractDir" }
          $iconArgs = @()
          if (Test-Path "assets/app_icon.png") {
            python -c "from PIL import Image; Image.open('assets/app_icon.png').convert('RGBA').save('assets/app_icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
            if (!(Test-Path "assets/app_icon.ico")) { throw "Failed to generate assets/app_icon.ico" }
            $iconArgs = @("--icon", "assets/app_icon.ico")
          }
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name "HHT" --collect-all customtkinter --collect-all pyautogui --collect-all pytesseract --collect-all pynput --collect-all PIL --collect-all resvg_py --hidden-import win32timezone --hidden-import win32gui --hidden-import win32process --hidden-import win32con --add-data "assets;assets" --add-data "$tesseractDir;tesseract" @iconArgs hethereau_hobbies_tool.py
          New-Item -ItemType Directory -Force release | Out-Null
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item "dist\HHT.exe" "release\Hethereau-HHT-Windows-x64-$version.exe"

      - name: Build Linux executable and packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --onedir --name HHT --add-data "assets:assets" --collect-all customtkinter --collect-all pyautogui --collect-all pytesseract --collect-all pynput --collect-all PIL --collect-all Xlib --collect-all resvg_py --hidden-import pynput.keyboard._xorg hethereau_hobbies_tool.py

          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          DEB_VERSION="$VERSION"
          if [[ "$DEB_VERSION" == *-* ]]; then
            DEB_BASE="${VERSION%%-*}"
            DEB_SUFFIX="${VERSION#*-}"
            DEB_TILDE="$(printf '\176')"
            DEB_VERSION="${DEB_BASE}${DEB_TILDE}${DEB_SUFFIX}"
          fi

          mkdir -p release
          PACKAGE_ROOT="$RUNNER_TEMP/hht-deb"
          install -d "$PACKAGE_ROOT/opt/hethereau-hobbies-tool" "$PACKAGE_ROOT/usr/bin" "$PACKAGE_ROOT/usr/share/applications" "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps" "$PACKAGE_ROOT/DEBIAN"
          cp -a dist/HHT/. "$PACKAGE_ROOT/opt/hethereau-hobbies-tool/"

          cat > "$PACKAGE_ROOT/usr/bin/hht" <<'LAUNCHER'
          #!/bin/sh
          exec /opt/hethereau-hobbies-tool/HHT "$@"
          LAUNCHER
          chmod 755 "$PACKAGE_ROOT/usr/bin/hht"

          ICON_ENTRY=""
          if [[ -f assets/app_icon.png ]]; then
            install -m 644 assets/app_icon.png "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps/hethereau-hobbies-tool.png"
            ICON_ENTRY="Icon=hethereau-hobbies-tool"
          fi
          cat > "$PACKAGE_ROOT/usr/share/applications/hethereau-hobbies-tool.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Hethereau Hobbies Tool (HHT)
          Comment=Automation toolkit for NTE hobbies
          Exec=hht
          $ICON_ENTRY
          Terminal=false
          Categories=Game;Utility;
          DESKTOP

          printf '%s\n' \
            "Package: hethereau-hobbies-tool" \
            "Version: $DEB_VERSION" \
            "Section: games" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Depends: libcairo2, libx11-6, libxtst6, libxinerama1, libxrandr2, libxi6, libxcb1, libxkbcommon-x11-0, scrot, wmctrl, tesseract-ocr, tesseract-ocr-eng, tesseract-ocr-rus" \
            "Maintainer: M1ST0R" \
            "Description: Hethereau Hobbies Tool (HHT)" \
            " Desktop automation toolkit for hobbies in Neverness to Everness." \
            > "$PACKAGE_ROOT/DEBIAN/control"

          dpkg-deb --build "$PACKAGE_ROOT" "release/hethereau-hobbies-tool_${DEB_VERSION}_amd64.deb"

          mkdir -p portable
          cp -a dist/HHT portable/HHT
          cat > portable/run.sh <<'RUN'
          #!/bin/sh
          DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$DIR/HHT/HHT" "$@"
          RUN
          chmod +x portable/run.sh
          cp README.md README.ru.md portable/
          tar -czf "release/Hethereau-HHT-Linux-x86_64-$VERSION.tar.gz" -C portable .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HHT-${{ steps.version.outputs.channel }}-${{ matrix.artifact }}-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for tag creation
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag for manual release
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          TAG="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "HHT $TAG"
          git push origin "$TAG"

      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: HHT-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.ref_name }}
          name: HHT ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.ref_name }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
